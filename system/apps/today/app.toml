name = "today"
display_name = "Today"
icon = "icon.svg"
priority = "user"
program = "today"
# The shell stops the app once no window shows it (a minute after the last one
# closes) and starts it again on the next request; false keeps it running for
# the life of the workspace. Set false if the app does work between requests
# (a background thread, a poller, a scheduled refresh, a subscription to an
# outside service, a job that outlives the window): a stop loses that work.
stop_when_no_windows = true

# How update-app boots a throwaway preview of this app: on a free port, over a
# scratch copy of its data (see .agents/skills/update-app/scripts/preview_app.py).
[preview]
# TODAY_DRY_SEND keeps a preview from sending anything: every send, archive, calendar add
# and GTD write is logged to dry_sends.jsonl in the copy instead.
# TODAY_WEEKLY_DIR points the weekly priorities notes at a copy too, so a preview never
# writes into the real weekly priorities folder. The copy is of the default ``weekly_dir``
# (config.py); if settings.json points it elsewhere, change this path to match.
env = {TODAY_PORT = "{port:main}", TODAY_HOST = "{host}", TODAY_DATA_DIR = "{copy:data}", TODAY_DRY_SEND = "1", TODAY_WEEKLY_DIR = "{copy:weekly}"}
copies = {data = "data/.apps/today", weekly = "data/Today/Weekly priorities"}
