/* Focus mode: calm motion, slow, low contrast, one thing moving at a time */

<body><div class="wrap" id="app"></div><div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TAGS = {ready:["ready","Draft ready"], you:["you","Needs you"], mine:["mine","Yours to do"], working:["working","Working on it"], waiting:["mine","Waiting on them"]};
let S = null, view = {page:"list"}, showCleared = false, showRules = false, pollTimer = null, searchQ = "", searchRes = null, searchTimer = null;
// Project and goal pages open at once from their last copy, then update in place
// when the fresh copy differs. The main list fetches them ahead so the first open is instant too.
const pageCache = {};
function fetchPage(url){
  return api(url).then(d=>{const str=JSON.stringify(d), changed=(pageCache[url]||{}).s!==str; pageCache[url]={d,s:str,at:Date.now()}; return changed});
}
async function pageData(url, rerender){
  const hit=pageCache[url], here=location.hash;
  if(!hit){ await fetchPage(url); return pageCache[url].d; }
  if(Date.now()-hit.at>1500) fetchPage(url).then(changed=>{
    if(changed && location.hash===here && !document.activeElement?.closest?.("#app input,#app textarea,#app select,.xp")) rerender();
  }).catch(()=>{});
  return hit.d;
}
function prefetchPages(){
  // The Projects tab, fetched ahead so its first open is instant too.
  if(!PJ.list) setTimeout(()=>api("/api/projects").then(d=>{ if(!PJ.list) PJ.list=d; }).catch(()=>{}), 1500);
}
const api = async (path, body) => {
  if (body !== undefined) for (const k in pageCache) delete pageCache[k];  // a change: pages read fresh
  const r = await fetch(path, body === undefined ? {} : {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || ("Something went wrong (" + r.status + ")"));
  return data;
};
// A sent message can't be unsent, so its Undo only puts the email back in the inbox.
function toast(t, undoKey){const e=$("toast");e.textContent=t;
  if(undoKey){const u=document.createElement("button");u.className="undo";u.textContent="Undo";
    u.onclick=async()=>{e.classList.remove("on");try{const r=await api("/api/undo-finish",{key:undoKey});toast(r.message)}catch(err){toast(err.message)}route()};e.appendChild(u)}
  e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),undoKey?7000:2400)}
function tag(state){const [c,l]=TAGS[state]||TAGS.mine;return `<span class="tag ${c}">${l}</span>`}
function fmtTime(iso){ if(!iso) return "not yet"; return new Date(iso).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}).toLowerCase(); }
function go(hash){ history.pushState({}, "", hash || (location.pathname + location.search)); route(); savePlace(); }
// Scroll only once the new page is drawn (pages load their data first), so a click never
// flashes the top of the old page. Back to the main list returns to where the user was on it.
let scrollTarget=null, listY=0;
new MutationObserver(()=>{ if(scrollTarget!==null){ scrollTo(0,scrollTarget); scrollTarget=null; } }).observe(document.getElementById("app"),{childList:true});
function route(){
  clearTimeout(pollTimer);
  if(view.page==="list") listY=scrollY;
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.startsWith("p:")) { view = {page:"proj", id:h.slice(2)}; TAB="projects"; renderProjectPage(); }
  else if (h) { view = {page:"item", key:h, from:(view.page==="proj"?"p:"+view.id:view.page==="item"?view.from:"")}; renderItem(); }
  else { view = {page:"list"}; scrollTarget=listY; loadList(); return; }
  scrollTarget=0;
}
window.onpopstate = route;

let searchOpen = false;
function bindSearch(){
  const btn=$("searchbtn"); if(btn) btn.onclick=()=>openSearch();
  const sb=$("search"); if(!sb) return;
  sb.oninput=()=>{searchQ=sb.value;clearTimeout(searchTimer);searchTimer=setTimeout(runSearch,250)};
  sb.onkeydown=e=>{if(e.key==="Escape"){searchQ="";searchRes=null;searchOpen=false;drawnTab=null;renderList()}};
  sb.onblur=()=>{ if(!searchQ) setTimeout(()=>{ if(!searchQ && searchOpen && document.activeElement?.id!=="search"){ searchOpen=false; drawnTab=null; renderList(); } },150); };
}
function openSearch(){ searchOpen=true; drawnTab=null; renderList(); const sb=$("search"); if(sb){ sb.focus(); sb.setSelectionRange(sb.value.length,sb.value.length); } }

async function runSearch(){
  if(!searchQ.trim()){ searchRes=null; drawnTab=null; renderList(); const sb=$("search"); if(sb) sb.focus(); return; }

}
function renderSearch(){

  const open=searchRes.items.filter(i=>i.status==="open"), done=searchRes.items.filter(i=>i.status!=="open");
  let h=`<h2>${n?`${open.length} open`:"Nothing found"}</h2>`;
  searchRes.goals.filter(g=>g.status==="open").forEach(g=>{h+=`<div class="row goal" data-key="${esc(g.key)}"><span class="goalbadge">GOAL</span><span class="what"><b>${esc(g.title)}</b></span></div>`});
  const one=i=>`<div class="row" data-key="${esc(i.key)}">${whoCell(i)}<span class="what">${esc(i.title)}${i.reason?`<div class="muted">${esc(i.reason)}</div>`:""}${i.only_in_conversation?`<div class="muted">mentioned in the conversation</div>`:""}</span>${i.status==="open"?"":`<span class="muted">${esc(i.status)}</span><button class="btn" data-back="${esc(i.key)}" title="Put it back on your list. Nothing is sent.">Bring back</button>`}</div>`;
  h+=open.map(one).join("");
  if(done.length) h+=foldHtml("search-done", `Finished · ${done.length}`, done.map(one).join(""));
  main.innerHTML=h;
  main.querySelectorAll("[data-fold]").forEach(f=>f.onclick=()=>{ openFolds.has(f.dataset.fold)?openFolds.delete(f.dataset.fold):openFolds.add(f.dataset.fold); renderSearch(); });
  main.querySelectorAll(".row[data-key]").forEach(r=>r.onclick=e=>{if(e.target.dataset.back)return;go("#"+encodeURIComponent(r.dataset.key))});

function dueTag(x){return x&&x.due_label?`<span class="tag due${x.due_days>0?" later":""}">${esc(x.due_label)}</span>`:x&&x.due_on?`<span class="tag">${esc(x.due_on)}</span>`:""}

function bindChecks(root, reload){root.querySelectorAll("[data-check]").forEach(b=>b.onclick=async e=>{e.stopPropagation();b.disabled=true;
  try{const r=await api("/api/done",{key:b.dataset.check});toast(r.message,b.dataset.check)}catch(err){toast(err.message)}reload()})}
// The user's four choices on anything the user owes, right on the row.
const PLAN = [["today","Today"],["tomorrow","Tomorrow"],["notmine","Not mine"],["drop","Drop"]];
function planBar(key,opts=PLAN){return `<span class="plan">${opts.map(([v,l])=>`<button class="pbtn${v==="drop"||v==="notmine"?" quiet":""}" data-plan="${v}" data-pkey="${esc(key)}">${l}</button>`).join("")}</span>`}
function backTag(i){return i.back_from?`<span class="tag back">Back from ${esc(fmtWeekday(i.back_from,-1))}</span>`:""}
function fmtWeekday(iso,shift=0){if(!iso)return"";const d=new Date(iso+"T12:00");d.setDate(d.getDate()+shift);return d.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"})}
function whoCell(i){return `<span class="who">${esc(i.who)}${i.platform?`<span class="via">${esc(i.platform)}</span>`:""}</span>`}
function taskRow(i,plan){return `<div class="row task" data-key="${esc(i.key)}">${checkBtn(i.key)}${whoCell(i)}<span class="what">${esc(i.title)}${plan?planBar(i.key,plan===true?PLAN:plan):""}</span>${backTag(i)}${dueTag(i)}${tag(i.state)}<span class="age">${esc(i.age)}</span></div><div class="xp" data-xp="${esc(i.key)}" hidden></div>`}
// A title edited where it sits: Enter or clicking away saves, Esc puts it back.
function editInPlace(el, save){ if(!el) return; let was=el.textContent;
  el.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();el.blur()} if(e.key==="Escape"){el.textContent=was;el.blur()} };
  el.onblur=async()=>{const t=el.textContent.replace(/\s+/g," ").trim(); if(!t){el.textContent=was;return} if(t===was) return;
    try{await save(t);was=t;el.textContent=t;toast("Title saved")}catch(err){el.textContent=was;toast(err.message)}};
  el.onpaste=e=>{e.preventDefault();document.execCommand("insertText",false,(e.clipboardData||window.clipboardData).getData("text/plain").replace(/\s+/g," "))};
}
function projectHash(key){return "#"+encodeURIComponent(key)}

// When Today last looked for signs this is already done, where, and what it found.
function doneLook(i){
  const l=i.done_look||(i.done_checked_at?{at:i.done_checked_at,found:(i.sent_found||[]).length,inbox:!!i.received_checked_at}:null);
  if(!l) return "";

async function fillXp(box, reload){
  const key=box.dataset.xp; let i;
  try{ i=await api("/api/item?key="+encodeURIComponent(key)); }catch(e){ box.innerHTML=`<div class="err">${esc(e.message)}</div>`; return; }
  const sec=(label,body,cls="")=>`<div class="xsec ${cls}">${label?`<div class="xlab">${label}</div>`:""}${body}</div>`;
  const later=`<span class="xlater"><button class="pbtn" data-plan="nextweek" data-pkey="${esc(key)}">Next week</button><label class="pbtn xdate">Pick a day<input type="date" data-until></label></span>`;
  let h="";
  if(i.manual){
    if(i.goal||i.project) h+=sec("",`<div class="xmeta">Filed under ${esc(i.goal?i.goal.title:((i.projects||[]).find(p=>p.id===i.project)||{title:i.project}).title)}${i.filed&&i.filed.why?` · ${esc(i.filed.why)}`:""}</div>`);
    if((i.steps_done||[]).length) h+=sec("Done so far",i.steps_done.map(s=>`<div class="xdoneline">&#10003; ${esc(s.text)} <span class="muted">${esc(fmtDay(s.at))}</span></div>`).join(""));
    h+=`<div class="xbar"><span class="xmain"><button class="btn" data-xdone>Whole thing done</button></span>${later}</div>`;
  } else {
    const name=esc(i.who_full||i.who), on=i.platform?` on ${esc(i.platform)}`:"";
    const who = i.kind==="promised"?`You told ${name}${on}`:i.kind==="handed"?`You asked ${name}${on}`:`${name} asked${on}`;
    h+=sec("",`<div class="xmeta">${who}${i.age?` · ${esc(i.age)} ago`:""}</div>${i.ask_text?`<div class="xquote">${esc(i.ask_text)}</div>`:""}`);
    if(i.did) h+=sec("Where it stands",`<div class="xtext">${esc(i.did)}</div>`);
    h+=doneLook(i);
    const t=i.target||{}, emails=i.emails||[];
    // A single reply is edited and sent right here; emails (several fields each) open the full page.
    const inline = !!i.draft && !emails.length && i.status!=="working";
    if(inline){
      const txt = xpEdits[key] ?? i.draft;
      h+=sec("Draft",`<textarea class="xdraft" data-xdraft rows="${Math.min(14,Math.max(3,txt.split("\n").length+1))}">${esc(txt)}</textarea>${t.can_send?`<div class="xsendto">${esc(t.detail||"")}</div>`:`<div class="xsendto">${i.source==="text"&&!i.elsewhere?`Copy it and send it to ${esc(i.who||"them")} in your chat app.`:`This goes to ${esc(i.to||"someone else")}, so copy it and send it there.`}</div>`}`);
    } else if(emails.length) h+=sec("Draft",`<div class="xdraft">${esc(emails[0].body||"")}</div>`);
    if(i.status==="working") h+=sec("",`<div class="xtext muted">Writing it now&hellip;</div>`);
    if(i.error) h+=sec("",`<div class="err">${esc(i.error)}</div>`);
    if(i.questions&&i.questions.length&&i.state==="you") h+=sec("Needs your answer",`<div class="xtext">${esc(i.questions[0].q)}</div>`);
    const main = inline ? (t.can_send?`<button class="btn primary" data-xsend>${esc(t.label)}</button>${i.source==="text"?`<button class="btn" data-xcopy>Copy</button>`:""}`:`<button class="btn primary" data-xcopy>Copy</button>`)
      : emails.length ? `<button class="btn primary" data-open-full>Review and send</button>` : (i.questions||[]).length ? `<button class="btn primary" data-open-full>Open</button>` : "";
    h+=`<div class="xbar"><span class="xmain">${main}<button class="btn" data-xdone>Done already</button>${main&&!inline?"":`<button class="btn" data-open-full>Open</button>`}</span>${later}</div>`;
    h+=`<div class="xlinks"><a href="/raw?key=${encodeURIComponent(key)}">See the conversation</a>${i.url?`<a href="${esc(i.url)}" target="_blank">Open in ${i.source==="slack"?"Slack":i.source==="email"?"Gmail":"the original"}</a>`:""}</div>`;
  }

  if(ta) ta.oninput=()=>{xpEdits[key]=ta.value};

  if(q("[data-xsend]")) q("[data-xsend]").onclick=async()=>{const b=q("[data-xsend]"), label=b.textContent;
    if(!ta.value.trim()){toast("The message is empty");return}

    catch(e){b.disabled=false;b.textContent=label;toast(e.message)}};
  if(q("[data-xdone]")) q("[data-xdone]").onclick=async()=>{const r=await api("/api/done",{key});toast(r.message,key);openRows.delete(key);reload()};
  if(q("[data-until]")) q("[data-until]").onchange=async e=>{if(!e.target.value)return;const r=await api("/api/plan",{key,choice:"nextweek",until:e.target.value});toast(r.message);openRows.delete(key);reload()};

function bindPlans(root, reload){root.querySelectorAll("[data-plan]").forEach(b=>b.onclick=async e=>{e.stopPropagation();const key=b.dataset.pkey;b.disabled=true;
  if(b.dataset.plan==="keep"){try{await api("/api/old/keep",{key});toast("Kept")}catch(err){toast(err.message)}reload();return}

function bindRows(root, reload){

// ---- The main page: one anatomy for every message item, everywhere ------------------

// Message rows that carry the "already handled" check (not waiting or filed-away rows).
const CHECKABLE = v => ["now","answers","replies","later","waiting"].includes(v) || /^(goal|project|proj):/.test(v);

const oneLine = s => String(s||"").replace(/\s+/g," ").trim();

// A name on a row always means a person is waiting: the user's own work shows none.

function whenHtml(w){ return `<span class="when${w==="today"?" hot":""}">${esc(w)}</span>`; }
function whoOf(r){ return r.own ? "" : (r.who || ""); }
// A long message shows its first dozen lines; "Show all" opens the rest in place (the user, 2026-11-14).
function msgHtml(inner){
  const lines = inner.split("\n").length + Math.floor(inner.length / 70);
  return lines > 14 ? `<div class="msg long">${inner}</div><button class="link showall" onclick="event.stopPropagation();this.previousElementSibling.classList.remove('long');this.remove()" title="Show the rest of their message">Show all</button>` : `<div class="msg">${inner}</div>`;
}
function wordsOf(r){ const w = r.words || r.title; return r.mine_words && !r.own && r.who ? `You: ${w}` : w; }
function goalTip(r, base){ return r.goal ? `For your goal: ${r.goal}` : base; }

    + `<div class="head" title="${esc(goalTip(r, TIPS.head))}">${todoStepHead(r)&&!r.step_total?`<button class="check2" data-stepdone="${esc("todo:"+r.key)}" title="Next step done. Nothing is sent."></button><span class="words t stepped">${todoStepHead(r)}</span>`:`<button class="check2" data-done="${esc(r.key)}" title="${esc(TIPS.check)}"></button><span class="words t">${esc(r.title||oneLine(r.words))}</span>`}<span class="st">${(S.plan.in_week||{})[r.key]?`<span class="intag" title="On Week's list">in Week</span>`:""}${rowRight(r, viewName)}${r.when?`<span class="stdue">${dueHtml(r, viewName)}</span>`:""}</span><span class="dueslot">${dueHtml(r, viewName)}</span>${rowAsk(r, viewName)}</div>`

// A goal's place in Now while its next move is worked out: quiet, grey, nothing to press.
function placeholderHtml(r){

function srcHtml(r){

// A move toward a weekly goal: links and a notes box for "go do", the draft in Talk to

function moveBody(r, viewName){

function bodyHtml(r, viewName){
  if(usesCard(r, viewName)) return cardShell(r, viewName);  // the one card, on every list and project page

function foldHtml(id, label, inner, tip){

const openFolds = new Set();
function names(rows){ const n=[...new Set(rows.map(r=>r.who||oneLine(r.title).split(" ").slice(0,3).join(" ")).filter(Boolean))]; return n.slice(0,6).join(", ")+(n.length>6?", ...":""); }
// One rounded list per section, thin lines between rows; no name column in a list of the user's own

function listHtml(rows, viewName, render, extraClass=""){
  // A name shows only on message rows (a to-do of the user's never shows one, nor a placeholder).
  const named = render!==todoHtml && rows.some(r=>whoOf(r) && r.kind!=="todo" && !r.manual && !r.placeholder);
  return `<div class="list${named?"":" noname"}${extraClass}" data-list="${esc(viewName)}">${rows.map(r=>render(r, viewName)).join("")}</div>`;

function section(title, rows, viewName, render=itemHtml, head=true){
  if(!rows.length) return "";
  const all = openFolds.has("more-"+viewName) || openIn[viewName] && rows.slice(PICK_LIMIT).some(r=>r.key===openIn[viewName]);
  const shown = all ? rows : rows.slice(0, PICK_LIMIT), more = rows.slice(shown.length);
  let h = head ? `<h2 class="sec">${esc(title)}</h2>` : "";
  h += listHtml(shown, viewName, render);
  if(more.length) h+=`<button class="more" data-moresec="${esc(viewName)}">+ ${more.length} more${render===todoHtml?"":`: ${esc(names(more))}`}</button>`;
  return h;
}

// ---- This week: the user's priorities in the user's own words, each goal with a done circle ---------
let doneOpen = false, sugOpen = null;
let weekEditing = false, weekOpen = null, weekFolded = localStorage.getItem("todayWeekFolded")==="1";
function weekHtml(w){
  const edit = `<button class="link editweek" id="weekedit" title="${esc(TIPS.weekedit)}" aria-label="Edit"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>`;
  const folded = weekFolded && !weekEditing;
  let h = `<h2 class="sec sechead"><span class="wkfold" id="wkfold" title="Fold or unfold your priorities">${folded?"&#9656;":"&#9662;"} This week</span>${folded&&w?`<span class="aside">${esc(w.focus||"")}</span>`:""}${edit}</h2>`;
  if((!w && !weekEditing) || folded) return h;
  h += `<div class="week">`;
  if(w && !weekEditing){
    if(w.priority){
      const f = w.focus && w.priority.includes(w.focus) ? w.priority.replace(w.focus, "\u0000") : null;
      h += `<div class="wk1">${f ? f.split("\u0000").map(esc).join(`<b>${esc(w.focus)}</b>`) : esc(w.priority)}</div>`;
    }
    // The quiet list (the user chose it 2026-11-13): the user's priorities and the user's own next steps only.
    // No lines, bars or arrows; a suggestion shows only when the user asks for one ("+ next step");
    // finished ones fold into one line at the bottom.
    const open=w.goals.filter(g=>!g.done), done=w.goals.filter(g=>g.done);
    h += `<ul class="goals">` + open.map(g=>{ const ref="goal:"+g.id, mine=!!stepOf(ref).text, asking=editingStep===ref||sugOpen===ref;
      return `<li title="${esc(g.away?"Away today, so not in Now.":"")}"><button class="check2" data-goal="${esc(g.id)}" data-on="1" title="${esc(TIPS.goaldone)}"></button><div class="gcol"><span class="g" data-goalopen="${esc(g.id)}" title="${esc(TIPS.goalopen)}">${esc(g.text)}</span>${g.status?` <span class="gmeta">${esc(g.status)}</span>`:""}${mine||asking?"":` <button class="gadd" data-addstep="${esc(ref)}" title="Write a next step, or see a suggestion">+ next step</button>`}${stepLine(g)}</div></li>${weekOpen===g.id&&g.move&&!g.in_now?`<li class="goalmove">${g.move.kind==="todo"?todoHtml(g.move,"week"):itemHtml(g.move,"week")}</li>`:""}`; }).join("") + `</ul>`;
    if(done.length) h += `<button class="gdonefold${doneOpen?" on":""}" id="gdonefold" title="Show what you finished this week">${done.length} done this week</button>` + (doneOpen?`<ul class="goals gdonelist">${done.map(g=>`<li class="gdone"><button class="check2" data-goal="${esc(g.id)}" data-on="0" title="Done. Click to undo."></button><div class="gcol"><span class="g">${esc(g.text)}</span></div></li>`).join("")}</ul>`:"");
  }
  if(weekEditing){
    h += `<textarea class="rdraft weektext" id="weektext" rows="12" title="${esc(TIPS.weekedit)}">${esc(w?w.text:"")}</textarea><div class="actions"><button class="btn primary" id="weeksave" title="${esc(TIPS.weeksave)}">Save</button><button class="link" id="weekcancel">Cancel</button></div>`;
  }

}
function bindWeek(root){

    const g=(S.page.week.goals||[]).find(x=>"goal:"+x.id===ref); const sug=g&&g.move&&!g.move.placeholder?g.move.title:"";
    if(sug) sugOpen=ref; else editingStep=ref; renderList();

// A click must never land on an element that a refresh just replaced (the user, 2026-11-14: tabs
// "not catching the click"). Refreshes in the background wait while a pointer is down or was
// pressed a moment ago, and redraw only when what they fetched differs from what is shown.
let pointerDown = false, lastPointer = 0, drawnPrint = "";
document.addEventListener("pointerdown", ()=>{ pointerDown = true; lastPointer = Date.now(); }, true);
document.addEventListener("pointerup", ()=>{ pointerDown = false; lastPointer = Date.now(); }, true);
const pointerBusy = () => pointerDown || Date.now() - lastPointer < 500;
function whenPointerFree(fn){ if(!pointerBusy()) { fn(); return; } setTimeout(()=>whenPointerFree(fn), 200); }
async function loadList(opts={}){
  const wk = api("/api/week").catch(()=>null);
  const fresh = await api("/api/state");
  const week = await wk;
  const print = JSON.stringify([fresh, week]);
  const changed = print !== drawnPrint;
  nowCheck(S, fresh);
  S = fresh; WK = week;
  const P = S.page;
  // Now opens with its first item expanded, so the user can flow through the three.
  const nowKeys = P.now.map(r=>r.key);
  if(!nowTouched && !nowKeys.includes(openIn.now)) openIn.now = nowKeys[0];
  await whenFinished();
  if(view.page==="list" && (changed || !opts.background || !$("main"))){
    if(opts.background) whenPointerFree(()=>{ if(view.page==="list"){ drawnPrint = print; renderList(); } });
    else { drawnPrint = print; renderList(); }
  }
  prefetchPages();
  const busy = [...P.now, ...P.answers, ...P.replies].some(r=>r.status==="working"||r.placeholder);
  clearTimeout(askedTimer);
  if(busy) askedTimer=setTimeout(()=>{ if(view.page==="list" && !document.activeElement?.closest?.("#app textarea,#app input")) loadList({background:true}); },4000);
}

// A redraw keeps what the user is looking at still: the first row or heading at the top of the
// screen stays at the same height, whatever changed above it (the user, 2026-11-14).
function keepPlace(draw){
  const marks=[...document.querySelectorAll("#app .item[data-item], #app h2.sec")];
  const anchor=marks.find(e=>e.getBoundingClientRect().bottom>0);
  const id=anchor && (anchor.dataset.item ? `.item[data-item="${CSS.escape(anchor.dataset.item)}"]` : null);
  const label=anchor && !id ? anchor.textContent : null, before=anchor ? anchor.getBoundingClientRect().top : 0;
  draw();
  if(!anchor || window.scrollY===0) return;
  const again=id ? document.querySelector("#app "+id) : [...document.querySelectorAll("#app h2.sec")].find(e=>e.textContent===label);
  if(again) window.scrollBy(0, again.getBoundingClientRect().top-before);
}
function renderList(){ keepPlace(drawList); }

// The page's top (tabs, search) is kept as it is when unchanged, so a click on a tab is never lost
// to a redraw of the list below it.
function drawShell(app, head, body){
  const top = $("shelltop"), rest = $("shellbody");
  if(top && rest && top.parentElement===app && top.dataset.html===head){ rest.innerHTML = body; return; }
  app.innerHTML = `<div id="shelltop"></div><div id="shellbody">${body}</div>`;
  const t = $("shelltop"); t.innerHTML = head; t.dataset.html = head;
}
// One handler set for every item, wherever it is drawn. ``reload`` redraws that page.
function bindItems(root, reload){
  root.querySelectorAll("[data-fold]").forEach(b=>b.onclick=()=>{b.classList.toggle("open");b.classList.contains("open")?openFolds.add(b.dataset.fold):openFolds.delete(b.dataset.fold)});
  root.querySelectorAll("[data-moresec]").forEach(b=>b.onclick=()=>{openFolds.add("more-"+b.dataset.moresec); renderList();});
  root.querySelectorAll(".item[data-item]").forEach(el=>bindItem(el, reload));
}
function bindItem(el, reload){
  const key=el.dataset.item, viewName=el.dataset.view, r=rowsByKey[key];
  const head=el.querySelector(".head");
  head.onclick=e=>{
    if(e.target.closest("button,a,input")) return;
    if(viewName==="now") nowTouched=true;
    const was=el.classList.contains("open");
    document.querySelectorAll(`.item.open[data-view="${CSS.escape(viewName)}"]`).forEach(x=>{x.classList.remove("open");x.querySelector(".body").innerHTML=""});
    openIn[viewName] = was ? null : key;
    if(!was){ el.classList.add("open"); el.querySelector(".body").innerHTML=bodyHtml(r, viewName); bindBody(el, reload); }
  };
  const done=el.querySelector("[data-done]");
  // Done (or "already handled"): recorded like Done already, nothing is sent, with Undo.
  // Checking a row that isn't open never moves what is open.
  if(done) done.onclick=async e=>{e.stopPropagation(); finishRow(el);
    try{ if(key.startsWith("c:")){ const res=await api("/api/projects/task",{id:view.id,key,action:"done"}); toastUndo(res.message, async()=>{await api("/api/undo",{batch:res.batch}); reload()}); }
      else { await api("/api/done",{key}); toastUndo("Marked done. Nothing sent", async()=>{const u=await api("/api/undo-finish",{key}); toast(u.message); reload()}); } }
    catch(err){toast(err.message)} reload()};
  // A dated row carries its date twice: in the icon's slot on a computer, under the title on a phone.
  el.querySelectorAll(".head [data-due]").forEach(due => due.onclick=e=>{e.stopPropagation(); openDuePicker(due, r, reload)});
  const pull=el.querySelector("[data-pull]");
  if(pull) pull.onclick=async e=>{e.stopPropagation();const res=await api("/api/pull-back",{key});toast(res.message);reload()};
  if(el.classList.contains("open")) bindBody(el, reload);
  bindRowExtras(el, reload);

// A redraw waits for rows still finishing, so the fill and fold are seen through (the user, 2026-11-14).
let finishing = 0, afterFinish = [];
const whenFinished = () => finishing ? new Promise(res => afterFinish.push(res)) : Promise.resolve();
// After Send or Not now in Now, the next one opens by itself.
function finishRow(el, tick=true){
  if(el.dataset.finishing) return; el.dataset.finishing="1"; finishing++;
  // The check fills, then the row fades and folds away as one smooth motion, no pause (the user, 2026-11-13).
  const viewName=el.dataset.view, wasOpen=el.classList.contains("open");
  if(viewName==="now") nowFinished(el);
  // Not now isn't done: that row just fades away, with no tick and no beat to see one (the user, 2026-11-16).
  const ck=el.querySelector(".check2"); if(ck&&tick) ck.classList.add("ticked");
  const big=wasOpen, h=el.offsetHeight, cs=getComputedStyle(el);
  let ended=false;
  const done=()=>{ if(ended) return; ended=true; el.classList.add("gone");
    finishing=Math.max(0,finishing-1); if(!finishing){ const w=afterFinish; afterFinish=[]; w.forEach(f=>f()); }
    if((viewName==="now"||isProjView(viewName))&&wasOpen){ const scope=viewName==="now"?'#now .item[data-item]:not(.gone):not(.placeholder)':`.item[data-view="${CSS.escape(viewName)}"]:not(.gone)`;
      const nxt=[...document.querySelectorAll(scope)].find(x=>x!==el); openIn[viewName]=nxt?nxt.dataset.item:null;
      if(nxt){nxt.classList.add("open");nxt.querySelector(".body").innerHTML=bodyHtml(rowsByKey[nxt.dataset.item],viewName);bindBody(nxt, viewName==="now"?()=>loadList():reloadProj)}} };
  // Timing (the user, 2026-11-14: "tactile, satisfying"): the press squeezes the circle, it fills
  // with a small spring and the tick draws (~300 ms); the row holds, done, for a beat so the eye
  // registers it (to ~550 ms); then it fades and drifts right (220 ms, ease-in) and the rows
  // below close the gap at once and settle softly (380 ms, ease-out). About 1.1 s in all; nothing waits on it.
  if(tick) el.classList.add("finishing");
  setTimeout(()=>{
    if(!el.animate||matchMedia("(prefers-reduced-motion: reduce)").matches){ done(); return; }
    el.style.overflow="hidden";
    const fade=220, fold=big?460:380;
    el.animate([
      {height:h+"px",marginBottom:cs.marginBottom,opacity:1,transform:"translateX(0)",easing:"cubic-bezier(.4,0,1,1)"},
      {height:h+"px",marginBottom:cs.marginBottom,opacity:0,transform:"translateX(10px)",offset:fade/(fade+fold),easing:"cubic-bezier(.22,1,.36,1)"},
      {height:"0px",marginBottom:"0px",opacity:0,transform:"translateX(10px)",borderTopWidth:"0px",borderBottomWidth:"0px",paddingTop:"0px",paddingBottom:"0px"}],
      {duration:fade+fold,fill:"forwards"}).onfinish=done;
  }, !tick?0:big?600:550);
  setTimeout(done, 2400);  // never hold redraws if the row was removed mid-motion
}
function bindBody(el, reload){
  const key=el.dataset.item, q=s=>el.querySelector(s);
  if(el.querySelector("[data-card]")){ drawCard(el, reload); bindRowExtras(el, reload); return; }
  // A weekly priority's move, or a Filed away row.
  const conv=q(".conv");
  if(conv) conv.onclick=async e=>{e.stopPropagation(); const box=q(".convo"); if(box.classList.toggle("on")){conv.textContent="Hide thread"; if(!box.innerHTML) box.innerHTML=await (await fetch("/raw?part=1&key="+encodeURIComponent(key))).text()||`<span class="muted">Nothing saved.</span>`} else conv.textContent="Whole thread"};
  const md=q("[data-movedone]");
  if(md) md.onclick=async()=>{finishRow(el); await api("/api/done",{key}); toastUndo("Done. Working out the next move", async()=>{const u=await api("/api/undo-finish",{key}); toast(u.message); reload()}); reload()};
  const notes=q("[data-notes]");
  if(notes){ let t=null; notes.oninput=()=>{xpEdits["notes:"+key]=notes.value; clearTimeout(t); t=setTimeout(()=>api("/api/move/notes",{key,text:notes.value}).catch(err=>toast(err.message)),800)}; }
  const nn=q("[data-notnow]");
  if(nn) nn.onclick=async()=>{finishRow(el, false); await api("/api/not-now",{key}); toastUndo("Moved to Slipped", async()=>{await api("/api/not-now",{key,on:false}); reload()}); reload()};
  bindRowExtras(el, reload);
}
// Every Send in Today: it goes in a few seconds unless Undo is pressed (the user, 2026-11-14: one
// send, always on the thread). what: "reply" | "email" | "user_draft"; fields: its addressing.
async function sendSoon({key, text, what="reply", fields={}, who="them", gone=()=>{}, undone=()=>{}, after=()=>{}}){
  const res = await api("/api/send-soon", {key, text, what, fields});
  gone();
  toastUndo(`Sending to ${who} in ${Math.round(res.seconds)} seconds`, async()=>{const c=await api("/api/send-cancel",{token:res.token}); toast(c.ok?"Not sent":"Already sent"); undone()}, res.seconds*1000);
  setTimeout(async()=>{const st=await api("/api/send-status?token="+encodeURIComponent(res.token)); if(st.state==="failed") toast("Not sent: "+st.error); else if(st.state==="sent") toast(st.message); else if(st.state==="unknown") toast("Today lost track of this send. Check your sent messages before sending again."); after(st)}, res.seconds*1000+2500);
  return res;
}
function toastUndo(text, undo, ms=10000){
  const e=$("toast"); e.textContent=text;
  const u=document.createElement("button"); u.className="undo"; u.textContent="Undo"; u.title="Stop it. Nothing is sent.";
  u.onclick=async()=>{e.classList.remove("on"); await undo()};
  e.appendChild(u); e.classList.add("on"); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove("on"), ms);
}

// A task on its own page (from search, a project's task link, or "Open the full
// page"): the same card as on every list, with its title to edit and the raw conversation linked.
async function renderItem(){
  clearTimeout(pollTimer);
  const key = view.key;
  let d; try { d = await api("/api/card?key="+encodeURIComponent(key)); } catch(e) { go(""); return; }
  CARD.data[key] = d;
  const app=$("app");
  const backTo = view.from&&view.from.startsWith("p:") ? {label:"Project", hash:"#"+view.from}
    : {label:"Today", hash:""};
  const raw = d.manual ? "" : `<a href="/raw?key=${encodeURIComponent(key)}" title="The saved conversation, as it came in">See the whole conversation</a>`;
  app.innerHTML = `<span class="back" id="back">&larr; ${esc(backTo.label)}</span><div class="itempage">`
    + `<div class="ititle"><span class="edtitle" id="ititle" contenteditable="true" spellcheck="true" title="Click to rename.">${esc(d.title)}</span></div>`
    + `<div class="imeta">${d.who ? esc(d.who) + (raw ? " · " : "") : ""}${raw}</div>`
    + `<div class="list"><div class="item open" data-item="${esc(key)}" data-view="page"><div class="body"><div class="c5" data-card="${esc(key)}"></div></div></div></div></div>`;
  rowsByKey[key] = rowsByKey[key] || {key, who: d.who, title: d.title};
  $("back").onclick=()=>go(backTo.hash);
  editInPlace($("ititle"), t=>api("/api/item/title",{key,title:t}));
  const el = app.querySelector(".item");
  drawCard(el, () => go(backTo.hash));
}

// ---- Tabs: Inbox, Today, Week, Someday (the user, 2026-11-12) --------------------------
// A phone opens on Inbox, a computer on Today. The tab is kept in the address (?tab=).
const TABS = [["inbox","Inbox"],["today","Today"],["week","Week"],["projects","Projects"],["someday","Someday"]];
const PHONE = matchMedia("(max-width:760px), (pointer:coarse)").matches;
let TAB = new URLSearchParams(location.search).get("tab") || (PHONE ? "inbox" : "today");
let drawnTab = null;
// One-off management views (the user, 2026-11-14): their own pages, linked at the top right.
const VIEWS = [];
function tabsHtml(extra=""){ return `<div class="tabs" id="tabs"><span class="seg">${TABS.map(([k,l])=>`<button class="tab${TAB===k?" on":""}" data-tab="${k}">${l}</button>`).join("")}</span>${extra}`
  + `<span class="views">${VIEWS.map(([href,l,tip])=>`<a class="view" href="${href}" title="${esc(tip)}">${l}</a>`).join("")}</span></div>`; }
function bindTabs(root){ root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=e=>{e.preventDefault(); switchTab(b.dataset.tab)}); }
function switchTab(t, opts={}){
  TAB=t; const u=new URL(location.href); u.searchParams.set("tab",t); history.replaceState(history.state,"",u.pathname+u.search+u.hash); savePlace();
  if(opts.weekStart) weekStart=opts.weekStart;
  drawnTab=null; searchQ=""; searchRes=null;
  // Someday reads fresh each time (Inbox may have filed a bullet there); a pending edit saves first.
  if(sdTimer){ clearTimeout(sdTimer); sdTimer=null; if(sdRoot) api("/api/someday",{text:serialize(sdRoot)}).catch(err=>toast(err.message)); }
  if(t==="someday") sdRoot=null;
  // From a page of its own (a project, a task), a tab goes back to the tabbed list on that tab;
  // the page's address would otherwise keep drawing the page (the user, Nov 15).
  if(view.page!=="list"){ go(""); return; }
  if(t==="today" && S){ renderList(); loadList({background:true}); }
  else if(t==="today") loadList(); else renderList();
  scrollTo(0,0);
}

// ---- small helpers -------------------------------------------------------------------
const mins = t => { const [h,m]=String(t).split(":").map(Number); return h*60+m; };
const hhmm = n => `${String(Math.floor(n/60)).padStart(2,"0")}:${String(n%60).padStart(2,"0")}`;
function hm(t){ if(!t) return ""; const [h,m]=t.split(":").map(Number); const ap=h>=12?"pm":"am", hh=h%12||12; return m?`${hh}:${String(m).padStart(2,"0")}${ap}`:hh+ap; }
function dur(n){ const h=Math.floor(n/60), m=n%60; return h&&m?`${h}h ${m}m`:h?`${h}h`:`${m}m`; }
function addDays(s,n){ const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function dayName(s, opts={weekday:"long"}){ return new Date(s+"T12:00:00").toLocaleDateString("en-US", opts); }
function shortDay(s){ return dayName(s,{weekday:"short",month:"short",day:"numeric"}); }
function menu(anchor, items){
  document.querySelectorAll(".menu").forEach(m=>m.remove());
  const m=document.createElement("div"); m.className="menu";
  items.forEach(([l,f])=>{const b=document.createElement("button"); b.textContent=l; b.onclick=()=>{m.remove(); f()}; m.appendChild(b)});
  document.body.appendChild(m);
  const r=anchor.getBoundingClientRect(); m.style.top=(scrollY+r.bottom+4)+"px";
  m.style.left=Math.max(8, Math.min(innerWidth-m.offsetWidth-8, scrollX+r.left))+"px";
  setTimeout(()=>document.addEventListener("click", function off(ev){ if(!m.contains(ev.target)){ m.remove(); document.removeEventListener("click", off) } }),0);
}
const planSteps = () => (S && S.plan && S.plan.steps) || {};
const stepOf = ref => planSteps()[ref] || {};
// What a planned thing is called: a to-do by its own words, anything else by its text.
const bigOf = it => it.kind==="todo" ? (it.then_todo || it.text) : it.text;
// "todo" is already a row style on this page, so a planned to-do is drawn as "task".
const kindClass = k => k==="todo" ? "task" : k;
const KIND_LABEL = {goal:"Priority", todo:"To-do", someday:"From Someday"};

// ---- The user's next steps (planning.py): the user writes them; the AI's move is only a suggestion --
async function saveStep(ref, text){ const r=await api("/api/step",{ref,text}); S.plan.steps[ref]=r.result; return r.result; }
let editingStep = null;
function stepLine(g){
  const ref="goal:"+g.id, st=stepOf(ref), sug=g.move && !g.move.placeholder ? (g.move.title||"") : "";
  if(editingStep===ref) return `<input class="stepedit" data-stepedit="${esc(ref)}" value="${esc(st.text||"")}" placeholder="Your next step, then Enter">`;
  if(st.text) return `<div class="gstep own" data-stepopen="${esc(ref)}" title="Your next step. Click to rewrite">${esc(st.text)}</div>`;
  if(sugOpen!==ref || !sug) return "";
  return `<div class="gstep">Suggested: ${esc(sug)} &middot; <button class="link" data-usestep="${esc(ref)}" data-text="${esc(sug)}" title="Make this your next step">Use it</button> &middot; <button class="link" data-stepopen="${esc(ref)}" title="Write your own instead">Write my own</button></div>`;
}
function bindSteps(root, redraw){
  root.querySelectorAll("[data-stepopen]").forEach(el=>el.onclick=e=>{e.stopPropagation(); editingStep=el.dataset.stepopen; redraw();
    const ed=document.querySelector("[data-stepedit]"); if(ed){ ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length); }});
  root.querySelectorAll("[data-usestep]").forEach(b=>b.onclick=async e=>{e.stopPropagation(); sugOpen=null; await saveStep(b.dataset.usestep, b.dataset.text); toast("Now it's your next step"); redraw()});
  const ed=root.querySelector("[data-stepedit]");
  if(ed){
    let done=false;
    const save=async()=>{ if(done) return; done=true; const ref=ed.dataset.stepedit, t=ed.value.trim(); editingStep=null;
      if(t!==(stepOf(ref).text||"")){ await saveStep(ref, t); toast(t?"Next step saved":"Cleared. The suggestion is back"); } redraw(); };
    ed.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); sugOpen=null; save(); } if(e.key==="Escape"){ done=true; editingStep=null; sugOpen=null; redraw(); } };
    ed.onblur=save;
  }
  root.querySelectorAll("[data-stepdone]").forEach(b=>b.onclick=async e=>{e.stopPropagation(); const ref=b.dataset.stepdone;
    const row=b.closest(".item"); if(row) finishRow(row);
    const r=await api("/api/step/done",{ref}); S.plan.steps[ref]=r.result;
    toast(r.result.text?`Step done. Next: ${r.result.text}`:"Step done. Write the next one when you're ready"); loadList();});
}

// ---- Today: the morning block ---------------------------------------------------------
let WK = null;   // this week's mornings and plan, from /api/week
const todayDay = () => WK && WK.days.find(d=>d.date===WK.today);
// A finished big thing stays on the morning; one dragged in after it stacks underneath
// (the user, 2026-11-13). The block being worked on is the first unfinished one.
const blocksOf = d => d ? [d.placed, ...(d.stacked||[])].filter(Boolean) : [];
const curBlock = d => blocksOf(d).find(p=>!p.item.done) || null;
function wonHtml(d, p, last){
  const key="celebrated:"+d.date+":"+p.ref, fresh=!localStorage.getItem(key);
  localStorage.setItem(key,"1");
  const steps=p.item.done_steps||[];
  return `<div class="block won${fresh?" fresh":""}"><div class="wonrow"><span class="wonmark" aria-hidden="true"></span><div><div class="wonlab">Done this morning</div><div class="bt">${esc(bigOf(p.item))}</div></div></div>${steps.length?`<div class="wonsteps">${steps.map(t=>`<div>&#10003; ${esc(t)}</div>`).join("")}</div>`:""}${last?`<div class="wonrest">The rest of the morning is yours.</div>`:""}</div>`;
}
function morningHtml(){
  const d=todayDay(); if(!d) return "";
  const m=d.morning, blocks=blocksOf(d), cur=curBlock(d);
  const free = m.start ? `${hm(m.start)} to ${hm(m.end)} is free${m.until?`, then ${esc(m.until)}`:""}` : "no free time";
  let h=`<h2 class="sec">This morning <span class="aside" title="${esc(WK.zone_line)}">${free}</span></h2>`;
  blocks.filter(p=>p.item.done).forEach(p=>{ h+=wonHtml(d, p, !cur); });
  if(cur){
    const it=cur.item, step=stepOf(it.ref).text||"";
    h+=`<div class="block${blocks.length>1?" next":""}"><div class="time">${hm(cur.start)} to ${hm(cur.end)} (${dur(mins(cur.end)-mins(cur.start))}) &middot; on your calendar</div><div class="bt">${esc(bigOf(it))}</div>`;
    if(step) h+=`<div class="mv">Your next step: <b>${esc(step)}</b></div>`;
    else if(it.suggested) h+=`<div class="mv">Suggested first move: <b>${esc(it.suggested)}</b></div>`;
    if(m.unanswered.length) h+=`<div class="muted">Overlaps an invite you haven't answered: ${esc(m.unanswered.map(e=>hm(e.start)+" "+e.title).join(", "))}</div>`;
    h+=`<div class="bbar"><button class="btn primary" id="startfocus" title="Clear the screen to this one thing">Start</button><button class="btn" id="moveblock" title="Open Week to move it">Move to another day</button></div></div>`;
  } else if(!blocks.length){
    h+=`<div class="block none">${m.away?esc(m.away)+". ":""}${m.start?`${hm(m.start)} to ${hm(m.end)} is open${m.away?" if you want to move a big thing forward":""}.`:"No open time this morning."} <a data-tab="week">Plan one in Week</a></div>`;
  }
  return h;
}
function bindMorning(root){
  const s=root.querySelector("#startfocus"); if(s) s.onclick=()=>startFocus();
  const mv=root.querySelector("#moveblock"); if(mv) mv.onclick=()=>switchTab("week");
}
// A goal move in Now shows the user's own next step when the user wrote one.
function nowRow(r){
  const ref = r.goal_id ? "goal:"+r.goal_id : "";
  const st = ref ? stepOf(ref) : {};
  if(!st.text) return r.placeholder?placeholderHtml(r):r.kind==="todo"?todoHtml(r,"now"):itemHtml(r,"now");
  return `<div class="item todoitem forgoal" title="${esc("For your goal: "+(r.goal||""))}"><div class="head"><button class="check2" data-stepdone="${esc(ref)}" title="Step done. Nothing is sent."></button><span class="words t">${esc(st.text)}</span><span class="st"><span class="yours">yours</span></span><span class="dueslot"></span><span class="askslot"></span></div></div>`;
}

// ---- Yours to do: a next step only if the user writes one, and "Plan in Week" -----------------
function todoStepHead(r){
  const st=stepOf("todo:"+r.key);
  if(!st.text) return null;
  return `${esc(st.text)}<span class="then">then: ${esc(r.title||oneLine(r.words))}</span>`;
}

// ---- Focus mode: Start clears the screen to the one big thing ----------------------------
let focus = null;  // {ref, end, started, done:[]}
function focusItem(){ return blocksOf(todayDay()).find(p=>p.ref===focus.ref) || null; }
function startFocus(){
  const cur=curBlock(todayDay()); if(!cur) return;
  focus={ref:cur.ref, end:cur.end, started:Date.now(), done:[]};
  const fv=document.createElement("div"); fv.id="focus"; fv.className="entering"; document.body.appendChild(fv);
  document.body.classList.add("focusing");
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ fv.className=""; drawFocus(); return; }
  fv.innerHTML=`<div class="breath"><div class="orb"></div><div class="bword" id="bword">Breathe in</div><div class="bgoal">${esc(bigOf(cur.item))}</div><button class="bskip" id="bskip">Skip</button></div>`;
  let over=false;
  const finish=()=>{ if(over) return; over=true; clearTimeout(t1); clearTimeout(t2); fv.classList.add("settle"); setTimeout(()=>{ fv.className=""; focus.started=Date.now(); drawFocus(); },700); };
  const t1=setTimeout(()=>{ const w=$("bword"); if(w){ w.classList.add("swap"); setTimeout(()=>{ w.textContent="and out"; w.classList.remove("swap"); },400); } },4000);
  const t2=setTimeout(finish,9000);
  $("bskip").onclick=finish;
}
function drawFocus(){
  const p=focusItem(); const fv=$("focus"); if(!fv||!focus) return;
  const it=p?p.item:{text:"",kind:""}, st=stepOf(focus.ref), step=st.text||"";
  let h=`<div class="fwrap"><div class="ftop"><span class="ftimewrap"><i class="bdot"></i><span class="ftime" id="ftime"></span></span><button class="btn" id="fexit">Done for now</button></div>`;
  h+=`<div class="flabel">${it.kind==="goal"?"This morning's priority":"This morning's big thing"}</div><div class="fgoal">${esc(bigOf(it))}</div>`;
  h+=`<div class="flabel" style="margin-top:28px">Next step</div>`;
  if(step) h+=`<div class="fstep"><button class="check fcheck" id="fcheck" title="Done. Then write the next one."></button><span>${esc(step)}</span></div>`;
  else if(it.suggested && !focus.done.length) h+=`<div class="fsug">Suggested: ${esc(it.suggested)} <a id="fuse">Use it</a></div>`;
  h+=(st.then||[]).map(q=>`<div class="fqueue">then: ${esc(q)}</div>`).join("");
  h+=`<input class="add fadd" id="fadd" placeholder="${step?"Add the step after this":"Write your next step"}, then Enter" autocomplete="off">`;
  if(focus.done.length) h+=`<div class="flabel" style="margin-top:26px">Done this morning</div>`+focus.done.map(d=>`<div class="fdone">&#10003; ${esc(d)}</div>`).join("");
  if(it.kind!=="someday") h+=`<button class="ffinish" id="ffinish" title="The whole big thing is done, not just this step">That finishes it</button>`;
  if(focus.won) h=`<div class="fwrap"><div class="ftop"><span></span><button class="btn" id="fexit">Back to Today</button></div><div class="fwon"><span class="wonmark" aria-hidden="true"></span><div class="flabel">Done this morning</div><div class="fgoal">${esc(bigOf(it))}</div>${focus.done.length?`<div class="wonsteps">${focus.done.map(d=>`<div>&#10003; ${esc(d)}</div>`).join("")}</div>`:""}<div class="wonrest">The rest of the morning is yours.</div></div>`;
  fv.innerHTML=h+`</div>`;
  const tick=()=>{ const el=$("ftime"); if(!el||!focus) return; const s=Math.floor((Date.now()-focus.started)/1000); el.textContent=`Focusing ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} · until ${hm(focus.end)}`; };
  tick(); clearInterval(window.__ft); window.__ft=setInterval(tick,1000);
  $("fexit").onclick=()=>{ clearInterval(window.__ft); const n=focus.done.length; focus=null; fv.classList.add("leaving"); loadList();
    setTimeout(()=>{ fv.remove(); document.body.classList.remove("focusing"); },600); if(n) toast(`${n} step${n>1?"s":""} done this morning`); };
  const fc=$("fcheck");
  if(fc) fc.onclick=async()=>{ fc.disabled=true; document.querySelector("#focus .fstep").classList.add("checked");
    const [r]=await Promise.all([api("/api/step/done",{ref:focus.ref}), new Promise(res=>setTimeout(res,650))]);
    S.plan.steps[focus.ref]=r.result; focus.done.push(step); drawFocus();
    const nc=document.querySelector("#focus .fstep"); if(nc) nc.classList.add("arrive"); else $("fadd").focus(); };
  const fu=$("fuse"); if(fu) fu.onclick=async()=>{ await saveStep(focus.ref, it.suggested); drawFocus(); };
  const ff=$("ffinish"); if(ff) ff.onclick=async()=>{ ff.disabled=true;
    if(step){ const r=await api("/api/step/done",{ref:focus.ref}); S.plan.steps[focus.ref]=r.result; focus.done.push(step); }
    const [kind,id]=[focus.ref.split(":")[0], focus.ref.slice(focus.ref.indexOf(":")+1)];
    try{ if(kind==="goal") await api("/api/weekly/goal",{id,on:true}); else if(kind==="todo") await api("/api/done",{key:id}); }catch(err){ toast(err.message); }
    localStorage.setItem("celebrated:"+(WK&&WK.today)+":"+focus.ref,"1");
    focus.won=true; clearInterval(window.__ft); drawFocus(); };
  const add=$("fadd"); if(!add) return; if(!step) add.focus();
  add.onkeydown=async e=>{ if(e.key!=="Enter"||!add.value.trim()) return; const v=add.value.trim(); add.value="";
    const r=await api("/api/step/then",{ref:focus.ref,text:v}); S.plan.steps[focus.ref]=r.result; drawFocus();
    toast(r.result.text===v?"That's your next step":"Added after the current step"); $("fadd").focus(); };
}

// ---- Week: one big thing a morning, on the user's real calendar ---------------------------------
let weekStart = null, WV = null, dragRef = null;
async function drawWeek(){
  if(!WV) $("main").innerHTML=`<div class="empty">Reading your calendar&hellip;</div>`;
  try{ WV = await api("/api/week"+(weekStart?"?start="+weekStart:"")); }catch(e){ $("main").innerHTML=`<div class="err">${esc(e.message)}</div>`; return; }
  weekStart = WV.start;
  if(TAB==="week") renderWeek();
}
const weekItems = () => [...WV.list.goals, ...WV.list.also];
function weekItem(ref){ return weekItems().find(i=>i.ref===ref) || (WV.days.find(d=>d.placed&&d.placed.ref===ref)||{}).placed?.item; }
const placedDay = ref => (WV.placed_refs||{})[ref];
function timePick(day, which, val, ref){
  // Mornings run 6am to 3pm; a block outside that (one stacked late in the day) keeps its own time.
  const at=val?mins(val):mins("06:00"), lo=Math.min(mins("06:00"), at-at%15), hi=Math.max(mins("15:00"), at);
  let o=""; for(let n=lo; n<=hi; n+=15){ const v=hhmm(n); o+=`<option value="${v}"${v===val?" selected":""}>${hm(v)}</option>`; }
  if(val && (at-lo)%15) o+=`<option value="${val}" selected>${hm(val)}</option>`;
  return `<select data-pick="${day}:${which}" data-ref="${esc(ref||"")}" title="${which==="start"?"When the block starts":"When it ends"}">${o}</select>`;
}
function renderWeek(){
  const days=WV.days, today=WV.today, thisMon=addDays(today, -((new Date(today+"T12:00").getDay()+6)%7));
  const label = WV.start===thisMon ? "This week" : WV.start===addDays(thisMon,7) ? "Next week" : WV.start===addDays(thisMon,-7) ? "Last week" : "Week of "+dayName(WV.start,{month:"short",day:"numeric"});
  const w=S.page.week;
  let h=`<div class="weekhead"><button class="btn" id="prevw" title="The week before">&larr;</button><h1>${label} <span class="muted" style="font-weight:400">${dayName(days[0].date,{month:"short",day:"numeric"})} to ${dayName(days[6].date,{month:"short",day:"numeric"})}</span></h1><button class="btn" id="nextw" title="The week after">&rarr;</button></div>`;
  if(w && w.priority) h+=`<div class="muted" style="margin:-2px 0 4px">${esc(w.priority)}</div>`;
  h+=`<div class="muted" style="margin:0 0 14px" title="Read from your calendar at ${esc(fmtTime(WV.calendar_at))}">${esc(WV.zone_line)}</div>`;
  const src=it=>{ const at=placedDay(it.ref); const sub = it.then_todo ? `then: ${esc(it.then_todo)}` : it.step ? `Next: ${esc(it.step)}` : it.suggested ? `Next (suggested): ${esc(it.suggested)}` : "";
    return `<div class="src ${kindClass(it.kind)}${at?" placed":""}" draggable="true" data-src="${esc(it.ref)}" title="${at?"On "+dayName(at)+". Drag it to another morning to move it.":"Drag onto a morning, or tap to pick a day."}">${esc(it.text)}${sub?`<span class="mv">${sub}</span>`:""}</div>`; };
  h+=`<div class="weekgrid"><div class="rail"><div id="rail-drop"><h2 class="sec">This week's priorities</h2>`;
  h+=WV.list.goals.map(src).join("") || `<div class="muted">No priorities written for this week.</div>`;
  h+=`<h2 class="sec r2">Also available <span class="aside">what you chose to plan</span></h2>`;
  h+=WV.list.also.map(src).join("") || `<div class="muted">Nothing else yet.</div>`;
  h+=`<div class="railnote">Your priorities are always here. Anything else is here because you pressed "Plan in Week" on it, in Today, Inbox or Someday. Drag one onto a morning, or tap it to pick a day. To take one off a day, drag it back here, tap its title, or press &times;.</div></div></div><div class="days">`;
  days.forEach((d,i)=>{
    const p=d.placed, mo=d.morning, past=d.date<today;
    const am=d.events.filter(e=>e.start<"13:00"), pm=d.events.filter(e=>e.start>="13:00");
    const flags=[mo.away?`<div class="flag">${esc(mo.away)}</div>`:"", mo.hold?`<div class="flag">Your hold, counted as open: ${esc(mo.hold.title)} ${hm(mo.hold.start)} to ${hm(mo.hold.end)}</div>`:"", mo.unanswered.length?`<div class="flag">Unanswered: ${esc(mo.unanswered.map(e=>hm(e.start)+" "+e.title).join(", "))}</div>`:""].join("");
    h+=`<div class="day${i>=5?" weekend":""}${past?" past":""}${d.date===today?" istoday":""}"><div class="dayname">${dayName(d.date,{weekday:"short"})} <span class="d">${+d.date.slice(8)}</span></div>`;
    if(p){
      const it=p.item;
      h+=`<div class="slot filled ${kindClass(it.kind)}${it.done?" isdone":""}" draggable="true" data-day="${d.date}" data-src="${esc(p.ref)}"><div class="lab">${KIND_LABEL[it.kind]||""}<button data-unplace="${d.date}" data-ref="${esc(p.ref)}" title="Take it off this day. Its calendar block is removed.">&times;</button></div><div class="bt" title="Move it or take it off">${it.done?"&#10003; ":""}${esc(bigOf(it))}</div><div class="tm">${timePick(d.date,"start",p.start,p.ref)} to ${timePick(d.date,"end",p.end,p.ref)}</div><div style="margin-top:4px"><span class="chip cal" title="An event on your Google Calendar">on your calendar</span></div>${flags}</div>`;

async function place(ref, day, note=""){

}
async function drop(ref, day){

  if(placedDay(ref)===day) return;

  // the list; a finished one stays and the new one stacks under it.
  const cur=curBlock(WV.days.find(d=>d.date===day));

async function unplace(day, ref){

}

// ---- Someday: one outline, saved as Someday.md ------------------------------------------
let SD = null, sdRoot = null, zoom = null, sdFocus = null, sdAtEnd = true, sdLast = null, sdTimer = null, sdWeek = new Set();
let uid = 0; const nid = () => "n"+(++uid);
const sdOpen = new Set(JSON.parse(localStorage.getItem("somedayOpen")||"[]"));
function mkNode(t){ const links=[...t.matchAll(/\[\[([^\]]+)\]\]/g)].map(m=>m[1]); return {id:nid(), text:t.replace(/\s*\[\[[^\]]+\]\]/g,"").trim(), links, note:"", children:[]}; }
function parseOutline(text){
  const root={id:"root", text:"Someday", children:[], links:[], note:""}, stack=[{indent:-1,node:root}]; let last=null;
  for(const raw of text.split("\n")){
    if(!raw.trim()) continue;
    const m=raw.match(/^(\s*)[-*+]\s?(.*)$/);
    if(m){ const ind=m[1].replace(/\t/g,"  ").length, n=mkNode(m[2]);
      while(stack.length>1 && stack[stack.length-1].indent>=ind) stack.pop();
      stack[stack.length-1].node.children.push(n); stack.push({indent:ind,node:n}); last=n; }
    else if(last) last.note=(last.note?last.note+"\n":"")+raw.trim();
    else { const n=mkNode(raw.trim()); root.children.push(n); last=n; }
  }
  return root;
}
function serialize(n, depth=0){
  let out=""; const pad="  ".repeat(depth);
  for(const c of n.children){
    out+=`${pad}- ${c.text}${c.links.map(l=>` [[${l}]]`).join("")}\n`;
    if(c.note.trim()) out+=c.note.split("\n").filter(l=>l.trim()).map(l=>`${pad}  ${l.trim()}`).join("\n")+"\n";
    out+=serialize(c, depth+1);
  }
  return out;
}
const isOpen = n => sdOpen.has(n.text);
function setOpen(n, on){ on?sdOpen.add(n.text):sdOpen.delete(n.text); localStorage.setItem("somedayOpen", JSON.stringify([...sdOpen])); }
function findParent(node, target){ for(const c of node.children){ if(c===target) return node; const p=findParent(c,target); if(p) return p; } return null; }
function findById(node, id){ if(node.id===id) return node; for(const c of node.children){ const f=findById(c,id); if(f) return f; } return null; }
function pathTo(t){ const path=[]; let n=t; while(n && n!==sdRoot){ path.unshift(n); n=findParent(sdRoot,n); } return path; }
function sdChanged(){ clearTimeout(sdTimer); const s=$("sdsaved"); if(s) s.textContent="Saving…";
  sdTimer=setTimeout(async()=>{ try{ await api("/api/someday",{text:serialize(sdRoot)}); const e=$("sdsaved"); if(e) e.textContent="Saved"; }catch(err){ const e=$("sdsaved"); if(e) e.textContent="Couldn't save: "+err.message; } },700); }
async function drawSomeday(){
  if(!sdRoot){ $("main").innerHTML=`<div class="empty">Loading&hellip;</div>`;
    SD=await api("/api/someday"); sdRoot=parseOutline(SD.text); zoom=sdRoot; sdWeek=new Set(Object.values(SD.week||{}).map(w=>w.text)); }
  renderSomeday();
}
function nodeHtml(n){

  if(n.note) h+=`<div class="onote" contenteditable="true" data-note="${n.id}">${esc(n.note)}</div>`;

  return h+`</div>`;
}
function renderSomeday(){
  const main=$("main");
  let h=`<div class="somehead"><span class="muted">Ideas for later. Nothing here has a date or asks anything of you.</span><span class="saved" id="sdsaved" title="Kept as Someday.md in your Projects folder"></span></div><div class="outline">`;

function placeCaret(el, atEnd){ el.focus(); const r=document.createRange(); r.selectNodeContents(el); r.collapse(!atEnd); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
const visibleIds = () => [...$("main").querySelectorAll("[data-txt]")].map(e=>e.dataset.txt);
async function toggleWeek(n){

function projectNames(){ return [...new Set((S.projects||[]).map(p=>p.title).filter(Boolean))]; }
function wireSomeday(){

  const zn=v.querySelector("[data-znote]"); if(zn){ zn.oninput=()=>{ zoom.note=zn.innerText; sdChanged(); };

    el.onkeydown=e=>{ if(e.key==="Backspace"&&!el.textContent){ e.preventDefault(); n.note=""; sdFocus=n.id; sdChanged(); renderSomeday(); } }; });

    const n=findById(sdRoot,el.dataset.txt);
    el.addEventListener("focus",()=>{ sdLast=n.id; $("obar").classList.add("on"); });
    el.oninput=()=>{ const t=el.textContent;
      if(t.endsWith("[[")){ n.text=t.slice(0,-2); el.textContent=n.text; placeCaret(el,true);
        const names=projectNames(); if(names.length) menu(el, names.map(p=>["Project: "+p, ()=>{ n.links.push(p); sdChanged(); renderSomeday(); }])); }
      else n.text=t;
      sdChanged(); };
    el.onkeydown=e=>{
      const parent=findParent(sdRoot,n)||zoom, sib=parent.children, i=sib.indexOf(n);
      if(e.key==="Enter"&&e.shiftKey){ e.preventDefault(); if(!n.note){ n.note=" "; renderSomeday(); const ne=v.querySelector(`[data-note="${n.id}"]`); ne.textContent=""; n.note=""; placeCaret(ne,true); } else placeCaret(v.querySelector(`[data-note="${n.id}"]`),true); return; }

function obarAct(act){

  if(act==="out"&&parent!==zoom){ const gp=findParent(sdRoot,parent)||sdRoot; sib.splice(i,1); gp.children.splice(gp.children.indexOf(parent)+1,0,n); sdChanged(); }

// Where the user was (tab, page, the open card, how far down) is kept on this device whenever Today
// is left, and a fresh load with no page in its address goes back there (the user, Nov 15: coming
// back to the app reloaded it onto the bare Projects list; a phone or the desktop app reopens the
// app's plain address, and the open card was never kept anywhere).
function savePlace(){
  const open = document.querySelector("#app .item.open[data-item]");
  try{ localStorage.setItem("todayPlace", JSON.stringify({search: location.search, hash: location.hash, openIn, y: scrollY,
    open: open ? open.dataset.item : "", openTop: open ? open.getBoundingClientRect().top : 0, at: Date.now()})); }catch(e){}
}
addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") savePlace(); });
addEventListener("pagehide", savePlace);
// Opening Today after a while starts on the Inbox (the user, Nov 16); coming back within half an
// hour (a switch to another app, a reload) still goes back to where the user was.
const PLACE_KEPT_MS = 30*60*1000;
const lastPlace = (()=>{ try{ return JSON.parse(localStorage.getItem("todayPlace")||"null"); }catch(e){ return null; } })();
const freshOpen = !location.hash && !(lastPlace && Date.now() - (lastPlace.at||0) < PLACE_KEPT_MS);
if(freshOpen){
  TAB = "inbox"; const u = new URL(location.href); u.searchParams.set("tab", "inbox");
  history.replaceState(history.state, "", u.pathname + u.search);
} else if(lastPlace && !location.hash){
  // The user's last place wins over a tab left in the address: the desktop window and a phone reopen
  // whatever address the app had when it was first opened (the user, Nov 16: the user left Today on the
  // Today tab and it came back on Projects).
  history.replaceState(history.state, "", location.pathname + (lastPlace.search||location.search) + (lastPlace.hash||""));
  TAB = new URLSearchParams(location.search).get("tab") || TAB;
  Object.assign(openIn, lastPlace.openIn||{});
}
route();
if(lastPlace && lastPlace.hash===location.hash){
  // The open card back where it sat on the screen once the page has drawn it; else the old scroll.
  if(lastPlace.y) scrollTarget = lastPlace.y;
  if(lastPlace.open){
    const until = Date.now() + 4000;
    const settle = () => {
      const el = [...document.querySelectorAll("#app .item.open[data-item]")].find(e => e.dataset.item === lastPlace.open);
      if(el && el.querySelector(".c5 .c5foot")){ scrollBy(0, el.getBoundingClientRect().top - lastPlace.openTop); return; }
      if(Date.now() < until) setTimeout(settle, 120);
    };
    setTimeout(settle, 120);
  }
}
setInterval(()=>{ if(view.page==="list" && !searchQ && !focus && !["add","search"].includes(document.activeElement?.id) && !document.activeElement?.closest?.(".xp,#app input,#app textarea,[contenteditable]")) loadList({background:true}); }, 60000);
</script>
