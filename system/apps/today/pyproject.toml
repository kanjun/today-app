[project]
name = "today"
version = "0.1.0"
description = "What you owe people from Slack and email, taken as far as it can go, plus your list for today"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
]

[project.scripts]
today = "today.runner:main"
today-sync = "today.sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/today"]

[dependency-groups]
dev = [
    # Used by test_no_type_errors in the ratchets, pinned to the version the shell and chat use.
    "ty==0.0.85",
]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]
